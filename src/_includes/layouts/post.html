{% extends "layouts/base.html" %}

{% block content %}

<section class="post-hero">
  <div class="wrapper">
    <h1>{{ title }}</h1>
    {% if date %}
      <p class="post-hero__meta">Published: {{ date }}</p>
    {% endif %}
  </div>
</section>

<section class="post-content">
  <div class="wrapper post-content__inner">
    {{ content | safe }}
  </div>
</section>

{% endblock %}
