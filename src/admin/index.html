<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      const createPreviewElement = window.h;
      const createPreviewClass = window.createClass;

      function resolveAsset(getAsset, assetPath) {
        if (!assetPath) {
          return '';
        }

        const resolvedAsset = getAsset(assetPath);
        if (!resolvedAsset) {
          return assetPath;
        }

        if (typeof resolvedAsset === 'string') {
          return resolvedAsset;
        }

        if (typeof resolvedAsset.toString === 'function') {
          return resolvedAsset.toString();
        }

        return assetPath;
      }

      function formatDate(value) {
        if (!value) {
          return '';
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return value;
        }

        return new Intl.DateTimeFormat('en-GB', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
        }).format(date);
      }

{# TODO: Change depending on collection #}
      function buildCollectionPreview(collectionLabel) {
        return createPreviewClass({
          render: function() {
            const props = this.props;
            const entry = props.entry;
            const data = entry.get('data');
            const title = data.get('title') || 'Untitled';
            const previewTitle = data.get('previewTitle') || title;
            const previewSummary = data.get('previewSummary') || '';
            const previewImage = resolveAsset(props.getAsset, data.get('previewImage'));
            const previewImageAlt = data.get('previewImageAlt') || previewTitle;
            const publishedDate = formatDate(data.get('date'));
            const body = props.widgetFor('body');

            return createPreviewElement(
              'article',
              { className: 'decap-preview' },
              createPreviewElement(
                'section',
                { className: 'decap-preview__hero' },
                createPreviewElement('p', { className: 'decap-preview__eyebrow' }, collectionLabel),
                createPreviewElement('h1', null, title),
                publishedDate ? createPreviewElement('p', { className: 'decap-preview__meta' }, publishedDate) : null
              ),
              previewImage
                ? createPreviewElement(
                    'section',
                    { className: 'decap-preview__media-wrap' },
                    createPreviewElement('img', {
                      className: 'decap-preview__media',
                      src: previewImage,
                      alt: previewImageAlt,
                    })
                  )
                : null,
              createPreviewElement(
                'section',
                { className: 'decap-preview__card' },
                createPreviewElement('p', { className: 'decap-preview__card-label' }, 'Home page card preview'),
                createPreviewElement('h2', null, previewTitle),
                previewSummary
                  ? createPreviewElement('p', null, previewSummary)
                  : createPreviewElement('p', { className: 'decap-preview__muted' }, 'No preview summary added yet.')
              ),
              createPreviewElement(
                'section',
                { className: 'decap-preview__body' },
                body
              )
            );
          }
        });
      }

      window.CMS.registerPreviewStyle('/css/admin-preview.css');
      window.CMS.registerPreviewTemplate('blog', buildCollectionPreview('Blog post'));
      window.CMS.registerPreviewTemplate('case-studies', buildCollectionPreview('Case study'));
    </script>
  </body>
</html>
