backend:
  name: git-gateway
  branch: main
# Uncomment the line below when running locally with `npx decap-server`.
# Remove or comment out before deploying to production.
local_backend: true
media_folder: "src/images/uploads"
public_folder: "/images/uploads"
collections:

  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "Blogs" # Used in the UI
    singular_label: "Blog" # Used in the UI when referring to a single document
    folder: "src/posts" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/post.html"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD"}
      - {label: "tags", name: "tags", widget: "list", default: ["posts"]}
      - {label: "Preview Title", name: "previewTitle", widget: "string", required: false, hint: "Optional shorter title for the home page card"}
      - {label: "Preview Summary", name: "previewSummary", widget: "text", required: false, hint: "Optional summary shown on the home page"}
      - {label: "Preview Image", name: "previewImage", widget: "image", required: false}
      - {label: "Preview Image Alt", name: "previewImageAlt", widget: "string", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "case-studies" # Used in routes, e.g., /admin/collections/case-studies
    label: "Case Studies" # Used in the UI
    singular_label: "Case Study" # Used in the UI when referring to a single document
    folder: "src/case-studies" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/case-study.html"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Client", name: "client", widget: "string"}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Job Date", name: "date", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD"}
      - {label: "Impact", name: "impact", widget: "string", hint: "A short statement of the impact of the project, e.g., 'Increased sales by 30%'"}
      - {label: "tags", name: "tags", widget: "list", default: ["case-study"]}
      - {label: "Preview Image", name: "previewImage", widget: "image", required: false}
      - {label: "Preview Image Alt", name: "previewImageAlt", widget: "string", required: false}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
      - {label: "Hero Image Alt", name: "heroImageAlt", widget: "string", required: false}
      - {label: "Brief", name: "brief", widget: "markdown", required: false, hint: "Short description of the client's brief"}
      - label: "Gallery Images"
        name: "galleryImages"
        widget: "list"
        required: false
        hint: "A couple of images shown after the brief"
        fields:
          - {label: "Image", name: "image", widget: "image"}
          - {label: "Alt Text", name: "alt", widget: "string", required: false}
      - {label: "Approach", name: "approach", widget: "markdown", required: false, hint: "How you tackled the project"}
      - {label: "Mid Hero Image", name: "midHeroImage", widget: "image", required: false}
      - {label: "Mid Hero Image Alt", name: "midHeroImageAlt", widget: "string", required: false}
      - {label: "Client Quote", name: "quote", widget: "string", required: false}
      - {label: "Quote Author", name: "quoteAuthor", widget: "string", required: false}
      - label: "Quote Images"
        name: "quoteImages"
        widget: "list"
        required: false
        hint: "Group of images shown alongside or after the client quote"
        fields:
          - {label: "Image", name: "image", widget: "image"}
          - {label: "Alt Text", name: "alt", widget: "string", required: false}
      - {label: "Results", name: "results", widget: "markdown", required: false, hint: "Outcomes and impact of the project"}
      - {label: "Body", name: "body", widget: "markdown", required: false}

  - name: "reviews"
    label: "Reviews"
    singular_label: "Review"
    folder: "src/reviews"
    create: true
    slug: ""
    fields:
      - {label: "Tags", name: "tags", widget: "hidden", default: ["reviews"]}
      - {label: "Permalink", name: "permalink", widget: "hidden", default: false}
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Company", name: "company", widget: "string", required: false}
      - {label: "Quote", name: "quote", widget: "text"}
      - {label: "Date", name: "date", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false}
      - {label: "URL", name: "url", widget: "string", required: false, hint: "Optional link to the original review"}