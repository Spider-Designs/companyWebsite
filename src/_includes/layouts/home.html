{% extends "layouts/base.html" %}

{% block content %}
<section class="coming-soon" aria-labelledby="coming-soon-title">
  <div class="coming-soon__bg" aria-hidden="true"></div>
  <div class="wrapper coming-soon__inner">
    <p class="coming-soon__eyebrow">Spider Designs</p>
    <h1 id="coming-soon-title" class="coming-soon__title">
      {{ page.title | default("New site coming soon") }}
    </h1>
    <p class="coming-soon__lead">
      {{ page.description | default("We are crafting a fresh digital experience. Check back soon to see the full launch.") }}
    </p>
    <div class="coming-soon__actions">
      <a href="mailto:hello@spiderdesign.co.uk" class="button coming-soon__cta">Contact us</a>
      {# <a href="/work" class="button coming-soon__cta coming-soon__cta--ghost">See past work</a> #}
    </div>
  </div>
</section>

{% endblock %}
